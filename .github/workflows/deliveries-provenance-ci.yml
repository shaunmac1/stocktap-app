name: Delivery provenance verification

on:
  pull_request:
    branches:
      - fix/csv-report-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-typecheck-build:
    runs-on: ubuntu-latest
    env:
      PORT: "5173"
      BASE_PATH: "/"
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run regression tests
        run: pnpm --filter @workspace/stocktap test -- --reporter=verbose | tee deliveries-test-output.txt

      - name: Run StockTap typecheck
        run: pnpm --filter @workspace/stocktap typecheck | tee deliveries-typecheck-output.txt

      - name: Build production bundle
        run: pnpm --filter @workspace/stocktap build | tee deliveries-build-output.txt

      - name: Upload verification output
        uses: actions/upload-artifact@v4
        with:
          name: delivery-provenance-output
          path: |
            deliveries-test-output.txt
            deliveries-typecheck-output.txt
            deliveries-build-output.txt
          if-no-files-found: error
