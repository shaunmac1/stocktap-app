name: Invoice review pipeline verification

on:
  pull_request:
    branches:
      - feature/catalogue-multiselect
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-typecheck-build:
    runs-on: ubuntu-latest
    env:
      PORT: "5173"
      BASE_PATH: "/"
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run StockTap regression tests
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/stocktap test -- --reporter=verbose | tee invoice-stocktap-test-output.txt

      - name: Run API extraction tests
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/api-server test -- --reporter=verbose | tee invoice-api-test-output.txt

      - name: Run StockTap typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/stocktap typecheck | tee invoice-stocktap-typecheck-output.txt

      - name: Run API server typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server typecheck | tee invoice-api-typecheck-output.txt

      - name: Build complete production workspace
        shell: bash
        run: |
          set -o pipefail
          pnpm build | tee invoice-build-output.txt

      - name: Upload verification output
        uses: actions/upload-artifact@v4
        with:
          name: invoice-review-output
          path: |
            invoice-stocktap-test-output.txt
            invoice-api-test-output.txt
            invoice-stocktap-typecheck-output.txt
            invoice-api-typecheck-output.txt
            invoice-build-output.txt
          if-no-files-found: error
