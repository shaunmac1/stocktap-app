    <script>
      /* Self-heal guard — if a hashed asset fails to load (404 because a
         stale cached index.html points at a deleted bundle after republish),
         unregister all service workers, clear all caches, and reload ONCE.
         sessionStorage prevents an infinite reload loop. */
      (function () {
        if (sessionStorage.getItem('__st_heal')) return;
        function heal() {
          sessionStorage.setItem('__st_heal', '1');
          var ps = [];
          if ('serviceWorker' in navigator) {
            ps.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              })
            );
          }
          if ('caches' in window) {
            ps.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
            );
          }
          Promise.all(ps).then(function () { location.reload(); });
        }
        /* Script / stylesheet load error — capture phase catches 404s on
           <script> tags injected by Vite's module preload. */
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) heal();
        }, true);
        /* Dynamic import / Vite chunk load failure (unhandled promise) */
        window.addEventListener('unhandledrejection', function (e) {
          var msg = String((e.reason && e.reason.message) || e.reason || '');
          if (msg.indexOf('Loading chunk') !== -1 ||
              msg.indexOf('dynamically imported module') !== -1 ||
              msg.indexOf('Failed to fetch dynamically') !== -1) {
            heal();
          }
        });
      })();
    </script>
